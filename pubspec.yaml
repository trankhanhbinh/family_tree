name: familytree
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
# In iOS, build-name: "CFBundleShortVersionString", build-number: "CFBundleVersion"
version: 1.0.4+5

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  cached_network_image: ^4.0.5
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  vnlunar: 1.1.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FDFBF7"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true